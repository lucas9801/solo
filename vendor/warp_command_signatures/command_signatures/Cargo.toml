[package]
name = "warp-command-signatures"
version = "0.0.0"
edition = "2021"
authors = ["Warp Team <dev@warp.dev>"]
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
cfg-if = "1.0.0"
itertools = "0.10.0"
lazy_static = "1.4.0"
log = "0.4"
rayon = { version = "1.5.3", optional = true }
regex = "1.5.4"
rust-embed = { version = "8.11", features = ["include-exclude"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "^3.21"
warp-completion-metadata = { path = "../completion_metadata" }

[features]
default = ["embed-signatures"]
embed-signatures = ["rayon", "rust-embed"]
