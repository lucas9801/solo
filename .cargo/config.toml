[target.'cfg(all())']
# v0 mangling scheme provides more detailed backtraces around closures
rustflags = ["-C", "symbol-mangling-version=v0", "--cfg", "tokio_unstable"]

[alias]
xtask = "run --package xtask --"
perf-test = ["test", "--profile", "release-fast", "--lib", "--bins", "--tests", "--all-features", "--config", "target.'cfg(true)'.runner='cargo run -p perf --release'", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]"]
# Keep similar flags here to share some ccache
perf-compare = ["run", "--profile", "release-fast", "-p", "perf", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]", "--", "compare"]

[target.'cfg(target_os = "windows")']
rustflags = [
    "--cfg",
    "windows_slim_errors",        # This cfg will reduce the size of `windows::core::Error` from 16 bytes to 4 bytes
    "-C",
    "target-feature=+crt-static", # This fixes the linking issue when compiling livekit on Windows
]

[env]
MACOSX_DEPLOYMENT_TARGET = "12.0"
# SOLO: transcribe.cpp (voice input) has UTF-8 sources with no BOM; MSVC reads them
# as the system code page (GBK on a Chinese Windows) and fails to compile. Only for
# the Windows MSVC target, so the Linux builds (remote server) are not touched.
CFLAGS_x86_64_pc_windows_msvc = { value = "-utf-8", force = true }
CXXFLAGS_x86_64_pc_windows_msvc = { value = "-utf-8", force = true }
# Solo links the C runtime statically (crt-static, below); transcribe.cpp picks the
# DLL runtime through CMAKE_MSVC_RUNTIME_LIBRARY unless told otherwise, which fails to link.
TRANSCRIBE_CMAKE_ARGS = { value = "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded", force = true }
# SOLO: tests assert Solo's English UI text, whatever the system language.
SOLO_LANGUAGE = { value = "en", force = false }
