# SOLO: Solo's own CI. Zed's workflows (run_tests.yml etc.) only run in
# zed-industries' repositories or on their self-hosted runners, so this is what
# checks Solo on GitHub-hosted runners.
#
# On every push and pull request to main and release/<x.y> branches it
# checks that the `solo` binary builds and runs the tests of the crates Solo
# changes most. It never uploads or publishes anything.

name: Solo CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']
  workflow_dispatch:

concurrency:
  group: solo-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  # Debug info makes test binaries several times larger, and disk is the
  # scarcest thing on a hosted runner.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check-and-test:
    name: Check solo and test Solo's crates (Windows)
    runs-on: windows-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The commit message check below needs the commits this push or
          # pull request brings.
          fetch-depth: 0

      # Commit messages describe changes in Solo's own words (see
      # script/check-commit-messages.ps1).
      - name: Check the commit messages
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ($env:BASE) { $range = "$($env:BASE)..HEAD" }
          elseif ($env:BEFORE -and $env:BEFORE -notmatch '^0+$' -and (git cat-file -t $env:BEFORE 2>$null) -eq 'commit') { $range = "$($env:BEFORE)..HEAD" }
          else { $range = "HEAD~1..HEAD" }
          ./script/check-commit-messages.ps1 $range

      # Quick, so before the build: the release script's version rules.
      - name: Test the release script
        run: |
          ./script/test-release-solo.ps1
          if ($LASTEXITCODE -ne 0) { throw "The release script tests failed" }

      # What solo-store.yml writes as the Store listing's release notes.
      - name: Test the Store release notes script
        run: |
          ./script/msix/test-store-release-notes.ps1
          if ($LASTEXITCODE -ne 0) { throw "The Store release notes tests failed" }

      - name: Show free disk space
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version
          cargo --version

      - name: Cache cargo registry and dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: solo-ci-windows
          # Pull requests reuse main's cache but don't write their own, which
          # would push it out of the 10 GB a repository gets.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check the solo binary
        run: cargo check --locked -p solo --bin solo

      - name: Build the tests
        run: cargo test --locked --no-run -p terminal -p terminal_view -p auto_update -p solo_agent_hook -p solo_terminal_host -p solo_update_helper -p agent_sessions -p agent_detection -p client -p context_server -p title_bar -p onboarding -p markdown_preview -p workspace -p agent_ui

      - name: Run the tests
        run: cargo test --locked --no-fail-fast -p terminal -p terminal_view -p auto_update -p solo_agent_hook -p solo_terminal_host -p solo_update_helper -p agent_sessions -p agent_detection -p client -p context_server -p title_bar -p onboarding -p markdown_preview -p workspace -p agent_ui

      - name: Show free disk space
        if: always()
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}
