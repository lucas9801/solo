# SOLO: builds Solo's releases on GitHub-hosted runners. Pushing a version tag
# (v*, which script/release-solo.ps1 does) builds, packages and creates a
# draft GitHub release; running it by hand only builds and packages.
#
#   build:   builds Solo (script/package-solo.ps1 -Step Stage: the solo-dist
#            profile and the licenses), checks solo.exe was built from this
#            commit, and uploads the staged files and the debug symbols
#            (solo.pdb, not in the package: crashes' addresses in a released
#            solo.exe map to lines with them).
#   msix:    packages the built files as Solo Code's Microsoft Store package
#            (script/package-solo-msix.ps1 -Store), unsigned (the Store
#            signs it), and uploads the .msixupload and the .msix as an
#            artifact. It isn't put in the release: publishing the release
#            starts the Solo Store submission workflow (solo-store.yml),
#            which submits the artifact to Partner Center once the repository
#            variable SOLO_STORE_SUBMIT_ENABLED is "true"; until then it's
#            uploaded to Partner Center by hand.
#   remote-server: builds the remote server for SSH, WSL and dev container
#            projects (crates/remote_server) for Linux x86_64 and aarch64 as
#            static musl binaries and uploads them gzipped
#            (solo-remote-server-linux-<arch>.gz, the names
#            crates/auto_update/src/solo_remote_server.rs downloads).
#   release: on a tag, once the Store package is made, creates the draft
#            release with the remote servers and the notes from
#            docs/release-notes/<version>.md. It's published by hand.
#
# Releases have no Windows download (no installer, no zip): Solo is
# installed and updated from the Microsoft Store, which signs its package, so
# nothing here is signed.
#
# See solo-ci.yml for why WebRTC is downloaded separately.

name: Solo package

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: solo-package-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WEBRTC_TAG: webrtc-0001d84-4
  WEBRTC_SHA256: b16f68e1fef8bd8089b9c7fc46c3c9b43ad5257c84460794a3668ec5accc1f13

jobs:
  build:
    name: Build Solo (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 340
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches Solo's version
        if: startsWith(github.ref, 'refs/tags/v')
        # The tag through the environment: a ref name may hold $( ), which
        # would run if it were put into the script.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = (Select-String -Path crates/zed/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne $env:REF_NAME) { throw "Tag $env:REF_NAME doesn't match crates/zed version $version" }

      # Before building, so a release doesn't fail on them hours later.
      - name: Check the release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = (Select-String -Path crates/zed/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $notes = "docs/release-notes/$version.md"
          if (-not (Test-Path $notes)) { throw "$notes is missing; script/release-solo.ps1 writes it" }
          ./script/check-solo-release-notes.ps1 -Path $notes

      - name: Show free disk space
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustc --version

      - name: Cache the prebuilt WebRTC
        id: webrtc-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/webrtc
          key: webrtc-${{ env.WEBRTC_TAG }}-win-x64-release

      - name: Download the prebuilt WebRTC
        if: steps.webrtc-cache.outputs.cache-hit != 'true'
        run: ./script/solo-ci-webrtc.ps1 -Tag $env:WEBRTC_TAG -Sha256 $env:WEBRTC_SHA256 -Dir "${{ runner.temp }}/webrtc"

      - name: Use the prebuilt WebRTC
        run: |
          $dir = Join-Path "${{ runner.temp }}" "webrtc/win-x64-release"
          if (-not (Test-Path (Join-Path $dir "webrtc.ninja"))) { throw "No WebRTC in $dir" }
          "LK_CUSTOM_WEBRTC=$dir" >> $env:GITHUB_ENV

      # Only the registry, git checkouts and cargo-about: a cached solo-dist
      # target wouldn't fit next to solo-ci's cache, and release builds should
      # start from scratch anyway.
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: solo-package-windows
          cache-targets: false

      - name: Build
        run: ./script/package-solo.ps1 -OutDir dist -Step Stage

      # Explorer's "Open with Solo Code" in the Store package (the msix job).
      - name: Build the Store package's context menu
        run: |
          $env:CARGO_INCREMENTAL = "0"
          cargo build --profile solo-dist -p explorer_command_injector --no-default-features --features solo
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }

      # Every exe carries product name Solo and Solo's version as product and
      # file version, and the build "<version>+stable.<run>.<commit>" in its
      # comments (crates/windows_resources).
      - name: Check the exes' version information
        run: |
          $version = (Select-String -Path crates/zed/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $failed = $false
          foreach ($exe in "solo.exe", "solo-agent-hook.exe", "solo-update-helper.exe", "solo-terminal-host.exe", "solo-cli.exe") {
            $info = (Get-Item "dist/Solo/$exe").VersionInfo
            Write-Host "$exe`: $($info.ProductName) $($info.ProductVersion), file $($info.FileVersion) ($($info.FileVersionRaw)), $($info.Comments)"
            $problems = @()
            if ($info.ProductName -ne "Solo") { $problems += "product name '$($info.ProductName)', not 'Solo'" }
            if ($info.ProductVersion -ne $version) { $problems += "product version '$($info.ProductVersion)', not $version" }
            if ($info.FileVersion -ne $version) { $problems += "file version '$($info.FileVersion)', not $version" }
            if ("$($info.FileVersionRaw)" -ne "$version.0" -or "$($info.ProductVersionRaw)" -ne "$version.0") { $problems += "fixed versions $($info.FileVersionRaw)/$($info.ProductVersionRaw), not $version.0" }
            if (-not $info.Comments -or -not $info.Comments.EndsWith(".${{ github.sha }}")) { $problems += "built from another commit ('$($info.Comments)'), not ${{ github.sha }}" }
            foreach ($problem in $problems) {
              Write-Host "::error::$exe`: $problem"
              $failed = $true
            }
          }
          if ($failed) { throw "The exes' version information doesn't match Solo $version" }

      - name: Show free disk space
        if: always()
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}

      # The files as built; the msix job packages them.
      - name: Upload the built files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-windows-x64-files
          path: dist/Solo/
          if-no-files-found: error

      - name: Upload the Store package's context menu
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-windows-x64-explorer-command
          path: target/solo-dist/explorer_command_injector.dll
          if-no-files-found: error

      # Each matches only the exes of this run.
      - name: Upload the debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-windows-x64-pdb
          path: target/solo-dist/*.pdb
          if-no-files-found: error

  # Solo Code for the Microsoft Store, from the built files: the Store signs
  # the package, and doesn't need the exes in it signed.
  msix:
    name: Package Solo for the Microsoft Store (Windows x64)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solo-windows-x64-files
          path: dist/Solo

      - name: Download the context menu
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solo-windows-x64-explorer-command
          path: dist/explorer-command

      - name: Download the debug symbols
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: solo-windows-x64-pdb
          path: dist/pdb

      # Windows PowerShell, which the script is written for (System.Drawing).
      - name: Package
        shell: powershell
        run: |
          ./script/msix/test-msix-version.ps1
          if ($LASTEXITCODE -ne 0) { throw "The MSIX version tests failed" }
          ./script/package-solo-msix.ps1 -Store -SourceDir dist/Solo -OutDir dist/msix -ExplorerCommandDll dist/explorer-command/explorer_command_injector.dll -SymbolsDir dist/pdb
          Get-ChildItem dist/msix | Format-Table Name, Length

      - name: Upload the Store package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-windows-x64-msix
          path: |
            dist/msix/*.msixupload
            dist/msix/*.msix
          if-no-files-found: error

  # Like Zed's script/bundle-linux did (Solo removed it): remote_server is
  # built on its own, so other crates' features don't change what it links.
  # Both are built natively with musl-gcc, as Zed did, aarch64 on GitHub's
  # Arm runner (free for public repositories): cross-compiling with
  # cargo-zigbuild failed on the linker argument rustc adds for aarch64 musl
  # (--fix-cortex-a53-843419), which zig's linker doesn't take. Neither needs
  # the Windows build, so this runs alongside it.
  remote-server:
    name: Build the remote server (Linux ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    env:
      ASSET: solo-remote-server-linux-${{ matrix.arch }}.gz
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "${{ matrix.target }}"
          rustc --version

      # lld: .cargo/bundle-config.toml links with it.
      - name: Install the musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools lld

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: solo-remote-server-${{ matrix.target }}
          cache-targets: false

      # .cargo/bundle-config.toml has the release optimization levels and,
      # for musl, +crt-static.
      - name: Build
        run: |
          set -euo pipefail
          export CC_x86_64_unknown_linux_musl=musl-gcc
          export CC_aarch64_unknown_linux_musl=musl-gcc
          cargo build --config .cargo/bundle-config.toml --config 'profile.release.strip="symbols"' \
            --release --locked --target "${{ matrix.target }}" --package remote_server

      # A static binary runs on any Linux; it must say Solo's version, which
      # Solo finds it by.
      - name: Check the binary
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/remote_server"
          info=$(file "$binary")
          echo "$info"
          case "$info" in
            *static*) ;;
            *) echo "::error::remote_server isn't statically linked"; exit 1 ;;
          esac
          version=$(tr -d '\r' < crates/zed/Cargo.toml | sed -n 's/^version = "\(.*\)"$/\1/p' | head -n 1)
          channel=$(cat crates/zed/RELEASE_CHANNEL)
          reported=$("$binary" version)
          echo "remote_server version: $reported (Solo $version, $channel)"
          if [ -z "$version" ]; then
            echo "::error::Couldn't read Solo's version from crates/zed/Cargo.toml"
            exit 1
          fi
          if [ "$channel" = "stable" ] && [ "$reported" != "$version" ]; then
            echo "::error::remote_server says $reported, not $version"
            exit 1
          fi

      - name: Compress
        run: |
          set -euo pipefail
          mkdir -p dist
          gzip -9 --no-name --stdout "target/${{ matrix.target }}/release/remote_server" > "dist/$ASSET"
          ls -l dist
          sha256sum "dist/$ASSET"

      - name: Upload the remote server
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: solo-remote-server-linux-${{ matrix.arch }}
          path: dist/${{ env.ASSET }}
          if-no-files-found: error

  # Waits for the remote servers too, but doesn't need them: the Store
  # package doesn't depend on the Linux build. A remote server that failed to
  # build is missing from the release (with a warning), and remote
  # development to Linux on that arch then says the release has none;
  # rerunning the failed job and then this one adds it to the draft. Without
  # the Store package (msix) there's no release: publishing it submits that
  # package to the Store (solo-store.yml).
  release:
    name: Create the draft release
    needs: [msix, remote-server]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.msix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the remote servers
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: solo-remote-server-linux-*
          merge-multiple: true
          path: dist

      # A draft: Solo's updater only sees published releases. Rerunning
      # replaces the files of the draft, never of a published release.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          # The notes from the version commit; their first two lines stay
          # the summaries the update notification shows.
          notes="docs/release-notes/$version.md"
          [ -f "$notes" ] || { echo "::error::$notes is missing"; exit 1; }
          mkdir -p dist
          tr -d '\r' < "$notes" > dist/release-notes.md
          files=()
          for arch in x86_64 aarch64; do
            server="dist/solo-remote-server-linux-$arch.gz"
            if [ -f "$server" ]; then
              files+=("$server")
            else
              echo "::warning::$server wasn't built; the release has no remote server for Linux $arch"
            fi
          done
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::Release $TAG is already published; it isn't changed"
              exit 1
            fi
            if [ "${#files[@]}" -gt 0 ]; then
              gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            fi
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file dist/release-notes.md
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Solo $version" --notes-file dist/release-notes.md
          fi
          echo "Draft release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
